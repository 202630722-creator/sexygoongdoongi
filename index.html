<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 판타지 주제 생성기 ✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        }

        body {
            background: radial-gradient(circle at center, #1b1035, #080417);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 215, 0, 0.25);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(138, 43, 226, 0.25);
        }

        h1 {
            font-size: 1.8rem;
            color: #ffd700;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #a491c3;
            margin-bottom: 35px;
        }

        /* 중앙 명사 키워드 카드 */
        .keyword-card {
            background: radial-gradient(circle at center, rgba(147, 112, 219, 0.15), rgba(0, 0, 0, 0.5));
            border: 2px solid #9370db;
            border-radius: 20px;
            padding: 40px 20px;
            margin-bottom: 30px;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 0 20px rgba(147, 112, 219, 0.3);
            position: relative;
            overflow: hidden;
        }

        .keyword-word {
            font-size: 3rem;
            font-weight: 800;
            color: #00ffff;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 0 10px rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .keyword-word.pop {
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .category-tag {
            font-size: 0.85rem;
            color: #ffd700;
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 4px 12px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button {
            background: linear-gradient(135deg, #8a2be2, #4b0082);
            color: #fff;
            border: none;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(138, 43, 226, 0.4);
            transition: all 0.2s ease;
            flex: 1;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(138, 43, 226, 0.7);
            background: linear-gradient(135deg, #9932cc, #6a0ded);
        }

        button:active {
            transform: translateY(1px);
        }

        button.copy-btn {
            flex: 0 0 auto;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #9370db;
            box-shadow: none;
            padding: 16px 20px;
        }

        button.copy-btn:hover {
            background: rgba(147, 112, 219, 0.3);
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffd700;
            color: #000;
            padding: 10px 24px;
            border-radius: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🔮 판타지 명사 주제 생성기 🔮</h1>
        <p class="subtitle">소설의 중심 테마가 될 영감의 단어를 뽑아보세요!</p>

        <div class="keyword-card">
            <span class="category-tag" id="category">카테고리</span>
            <div class="keyword-word" id="word">단어</div>
        </div>

        <div class="btn-group">
            <button onclick="generateNoun()">🎲 명사 주제 뽑기</button>
            <button class="copy-btn" onclick="copyResult()">📋 복사</button>
        </div>
    </div>

    <div id="toast" class="toast">단어가 복사되었습니다!</div>

    <script>
        // 판타지 소설 주제용 명사 데이터베이스 (필요 시 자유롭게 단어 추가 가능)
        const nounDatabase = [
            // [자연/우주]
            { category: "자연/우주", word: "별" },
            { category: "자연/우주", word: "자연" },
            { category: "자연/우주", word: "심해" },
            { category: "자연/우주", word: "달" },
            { category: "자연/우주", word: "폭풍" },
            { category: "자연/우주", word: "서리" },
            { category: "자연/우주", word: "유성" },
            { category: "자연/우주", word: "오로라" },
            { category: "자연/우주", word: "심연" },

            // [물건/신비]
            { category: "사물/신비", word: "시계" },
            { category: "사물/신비", word: "거울" },
            { category: "사물/신비", word: "열쇠" },
            { category: "사물/신비", word: "가면" },
            { category: "사물/신비", word: "나침반" },
            { category: "사물/신비", word: "그림자" },
            { category: "사물/신비", word: "인형" },
            { category: "사물/신비", word: "유리병" },
            { category: "사물/신비", word: "초상화" },

            // [개념/추상]
            { category: "개념/추상", word: "기억" },
            { category: "개념/추상", word: "운명" },
            { category: "개념/추상", word: "꿈" },
            { category: "개념/추상", word: "시간" },
            { category: "개념/추상", word: "시작" },
            { category: "개념/추상", word: "영혼" },
            { category: "개념/추상", word: "맹세" },
            { category: "개념/추상", word: "금기" },
            { category: "개념/추상", word: "환상" },

            // [장소/세계]
            { category: "장소/세계", word: "미궁" },
            { category: "장소/세계", word: "탑" },
            { category: "장소/세계", word: "방주" },
            { category: "장소/세계", word: "경계" },
            { category: "장소/세계", word: "낙원" },
            { category: "장소/세계", word: "폐허" },
            { category: "장소/세계", word: "도서관" },
            { category: "장소/세계", word: "은신처" }
        ];

        let currentWord = "";

        function generateNoun() {
            const randomIndex = Math.floor(Math.random() * nounDatabase.length);
            const selected = nounDatabase[randomIndex];

            const categoryEl = document.getElementById('category');
            const wordEl = document.getElementById('word');

            // 애니메이션 리셋
            wordEl.classList.remove('pop');
            void wordEl.offsetWidth; // trigger reflow

            // 데이터 적용
            categoryEl.innerText = selected.category;
            wordEl.innerText = selected.word;
            currentWord = selected.word;

            // 애니메이션 적용
            wordEl.classList.add('pop');
        }

        function copyResult() {
            if (!currentWord) return;

            navigator.clipboard.writeText(currentWord).then(() => {
                showToast();
            });
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 1500);
        }

        // 페이지 시작 시 무작위 단어 하나 생성
        window.onload = generateNoun;
    </script>
</body>
</html>

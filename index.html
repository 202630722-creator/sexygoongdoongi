<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 판타지 소설 주제 생성기 ✨</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', 'Malgun Gothic', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c20, #150e28, #281537);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), 0 0 15px rgba(186, 85, 211, 0.2);
        }

        h1 {
            font-size: 2rem;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            margin-bottom: 10px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #b3a2c7;
            margin-bottom: 30px;
        }

        .card-container {
            background: rgba(0, 0, 0, 0.4);
            border: 1px dashed #9370db;
            border-radius: 15px;
            padding: 25px 20px;
            margin-bottom: 30px;
            min-height: 220px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            transition: all 0.3s ease;
        }

        .keyword-item {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #e6e6fa;
            opacity: 0;
            transform: translateY(10px);
            animation: fadeInUp 0.4s forwards;
        }

        .keyword-item span.highlight {
            color: #00ffff;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 255, 255, 0.5);
        }

        .keyword-item span.highlight-gold {
            color: #ffd700;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255, 215, 0, 0.5);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(45deg, #8a2be2, #4b0082);
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(138, 43, 226, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(138, 43, 226, 0.6);
            background: linear-gradient(45deg, #9932cc, #6a0ded);
        }

        button:active {
            transform: translateY(1px);
        }

        button.copy-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #9370db;
            box-shadow: none;
        }

        button.copy-btn:hover {
            background: rgba(147, 112, 219, 0.3);
            box-shadow: 0 5px 15px rgba(147, 112, 219, 0.2);
        }

        /* toast 메시지 스타일 */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #ffd700;
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🗡️ 판타지 주제 생성기 🔮</h1>
        <p class="subtitle">버튼을 눌러 나만의 흥미진진한 판타지 웹소설 주제를 뽑아보세요!</p>

        <div class="card-container" id="result-box">
            <p style="color: #888;">주제 생성 버튼을 누르면 새로운 소재가 조합됩니다!</p>
        </div>

        <div class="btn-group">
            <button onclick="generateTopic()">🎲 주제 뽑기</button>
            <button class="copy-btn" onclick="copyResult()">📋 결과 복사</button>
        </div>
    </div>

    <div id="toast" class="toast">클립보드에 복사되었습니다!</div>

    <script>
        // 키워드 데이터베이스 (원하는 단어를 자유롭게 추가/수정 가능)
        const backgrounds = [
            "멸망 직전의 마법 아카데미", "신들이 버린 지하 던전", "스팀펑크풍의 제국 수도",
            "무한히 확장하는 이세계 탑", "마왕이 통치하는 평화로운 정글", "차원 이동자들의 은신처",
            "드래곤이 경영하는 금륭 중심 도시", "심해 속에 숨겨진 고대 제국"
        ];

        const identities = [
            "시한부 삶을 사는 시골 영지 악역 도련님", "기억을 잃은 최강의 네크로맨서", "퇴사하고 싶은 9급 행정직 마법사",
            "F급 능력자로 판명된 전설의 성기사", "괴물들의 언어를 알아듣는 요리사", "버려진 황자 출신의 만능 연금술사",
            "빙의당해 몬스터 보스가 된 평범한 고등학생", "전설의 검에 깃든 츤데레 정령"
        ];

        const itemsOrElements = [
            "미래의 소설책을 읽는 능력", "죽을 때마다 24시간 전으로 회귀하는 시계", "모든 법칙을 무시하는 절대 무적의 프라이팬",
            "몬스터를 길들이는 감정 조절 향수", "타인의 능력치를 사서 모으는 시스템 창", "소원을 들어주지만 거짓말만 하는 고양이",
            "상대방의 마음을 읽는 은빛 가면"
        ];

        const goals = [
            "마왕성을 인수합병하여 대기업으로 만들기", "억울한 누명을 벗고 편안한 은퇴 생활 즐기기",
            "세계를 멸망시키려는 진짜 주인공을 저지하기", "잃어버린 자신의 진짜 몸을 되찾기",
            "이세계에 최고급 한식당 차리기", "신들의 게임에서 승리해 지구로 돌아가기"
        ];

        let currentResultText = "";

        function getRandomElement(array) {
            return array[Math.floor(Math.random() * array.length)];
        }

        function generateTopic() {
            const bg = getRandomElement(backgrounds);
            const identity = getRandomElement(identities);
            const item = getRandomElement(itemsOrElements);
            const goal = getRandomElement(goals);

            const resultBox = document.getElementById('result-box');
            
            // 결과 생성
            resultBox.innerHTML = `
                <div class="keyword-item" style="animation-delay: 0.1s;">
                    🏰 <strong>배경:</strong> <span class="highlight-gold">${bg}</span>에서
                </div>
                <div class="keyword-item" style="animation-delay: 0.2s;">
                    👤 <strong>주인공:</strong> <span class="highlight">${identity}</span>가
                </div>
                <div class="keyword-item" style="animation-delay: 0.3s;">
                    ✨ <strong>핵심 요소:</strong> <span class="highlight-gold">${item}</span>을(를) 가지고
                </div>
                <div class="keyword-item" style="animation-delay: 0.4s;">
                    🎯 <strong>목표:</strong> <span class="highlight">${goal}</span>!
                </div>
            `;

            // 복사용 텍스트 저장
            currentResultText = `[판타지 주제 조합]\n- 배경: ${bg}\n- 주인공: ${identity}\n- 핵심 요소: ${item}\n- 목표: ${goal}`;
        }

        function copyResult() {
            if (!currentResultText) {
                alert("먼저 주제를 생성해주세요!");
                return;
            }

            navigator.clipboard.writeText(currentResultText).then(() => {
                showToast();
            }).catch(err => {
                alert("복사 실패! 다시 시도해주세요.");
            });
        }

        function showToast() {
            const toast = document.getElementById("toast");
            toast.classList.add("show");
            setTimeout(() => {
                toast.classList.remove("show");
            }, 2000);
        }

        // 페이지 로드 시 첫 번째 주제 자동 생성
        window.onload = generateTopic;
    </script>
</body>
</html>
